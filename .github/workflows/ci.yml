name: CI

on:
  push:
    branches: ["main", "production-hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/api_server/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend shared tests
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tooling
        run: python -m pip install bandit pip-audit
      - name: Bandit
        run: bandit -q -r backend shared -x tests
      - name: Dependency audit
        run: pip-audit -r backend/api_server/requirements.txt

# CI hardening track: rerun after security regression fix.
