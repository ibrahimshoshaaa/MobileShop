name: Production audit

on:
  workflow_dispatch:
  push:
    branches: ["release/production-gates-audit"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run production audit
        run: python scripts/production_audit.py
      - name: Compile all production Python surfaces
        run: python -m compileall -q backend shared tests apps/desktop apps/pos
