name: Provision staging

on:
  push:
    branches: ["release/production-gates-audit"]
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install provisioning dependencies
        run: python -m pip install --upgrade pip && python -m pip install firebase-admin libsql-client
      - name: Provision isolated staging principal
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STAGING_UID: ${{ secrets.FIREBASE_STAGING_UID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          STAGING_TENANT_ID: staging-tenant
          STAGING_BRANCH_ID: staging-main
        run: python scripts/provision_staging.py
