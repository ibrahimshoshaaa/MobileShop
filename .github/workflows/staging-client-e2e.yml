name: Staging client E2E

on:
  workflow_dispatch:
  push:
    branches: ["release/production-gates-audit"]

permissions:
  contents: read

jobs:
  client-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install staging auth tooling
        run: python -m pip install firebase-admin libsql-client
      - name: Provision staging principal
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STAGING_UID: ${{ secrets.FIREBASE_STAGING_UID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          STAGING_TENANT_ID: staging-tenant
          STAGING_BRANCH_ID: ${{ secrets.STAGING_BRANCH_ID }}
        run: python scripts/provision_staging.py
      - name: Mint fresh staging Firebase ID token
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STAGING_UID: ${{ secrets.FIREBASE_STAGING_UID }}
        run: python scripts/refresh_staging_token.py
      - name: Run authenticated desktop-client E2E
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_BRANCH_ID: ${{ secrets.STAGING_BRANCH_ID }}
          PYTHONPATH: .
        run: python scripts/staging_client_e2e.py
