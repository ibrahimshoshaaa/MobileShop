name: Turso Deep Integration

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/complete-release-gates", "release/production-gates-audit"]

permissions:
  contents: read

jobs:
  turso-deep:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r backend/api_server/requirements.txt pytest
      - name: Run live Turso deep tests
        run: |
          python - <<'PY'
          import os
          import threading
          import uuid
          from concurrent.futures import ThreadPoolExecutor
          from backend.functions.offline.protocol import SyncProtocol

          if not os.environ.get("TURSO_DATABASE_URL") or not os.environ.get("TURSO_AUTH_TOKEN"):
              raise SystemExit("Missing Turso secrets")

          run_id = uuid.uuid4().hex[:12]
          calls = []
          lock = threading.Lock()

          def envelope(command_id, tenant, branch, payload="ok"):
              return {
                  "command_id": command_id,
                  "tenant_id": tenant,
                  "branch_id": branch,
                  "payload": payload,
              }

          # Option A from the ERP plan: one shared database connection owns
          # the business transaction + sync receipt lifecycle. Concurrent
          # callers are serialized by SyncProtocol's lock on that connection.
          sync = SyncProtocol()
          try:
              tenant = f"deep-{run_id}"
              branch = f"branch-{run_id}"
              env = envelope(f"idem-{run_id}", tenant, branch)

              def execute(e):
                  with lock:
                      calls.append(e["command_id"])
                  return {"applied": True, "run_id": run_id}

              with ThreadPoolExecutor(max_workers=2) as pool:
                  futures = [
                      pool.submit(sync.upload, [env], tenant_id=tenant, branch_id=branch, executor=execute)
                      for _ in range(2)
                  ]
                  results = [f.result() for f in futures]

              assert calls == [env["command_id"]], f"duplicate execution: {calls}"
              statuses = {r["results"][0]["status"] for r in results}
              assert "APPLIED" in statuses
              assert statuses <= {"APPLIED", "PROCESSING"}

              replay = sync.upload([env], tenant_id=tenant, branch_id=branch, executor=execute)
              assert replay["results"][0]["status"] == "APPLIED"
              assert replay["results"][0]["idempotent_replay"] is True
              assert calls == [env["command_id"]]

              reused = envelope(env["command_id"], tenant, branch, payload="different")
              conflict = sync.upload([reused], tenant_id=tenant, branch_id=branch, executor=execute)
              assert conflict["results"][0]["error_code"] == "IDEMPOTENCY_KEY_REUSE"

              bad_tenant = envelope(f"scope-{run_id}", "other-tenant", branch)
              scope = sync.upload([bad_tenant], tenant_id=tenant, branch_id=branch, executor=execute)
              assert scope["results"][0]["error_code"] == "ACCOUNT_SCOPE_MISMATCH"

              bad_branch = envelope(f"scope-branch-{run_id}", tenant, "other-branch")
              scope2 = sync.upload([bad_branch], tenant_id=tenant, branch_id=branch, executor=execute)
              assert scope2["results"][0]["error_code"] == "ACCOUNT_SCOPE_MISMATCH"

              downloaded = sync.download(tenant_id=tenant, branch_id=branch, cursor=0, limit=100)
              ids = [x["command_id"] for x in downloaded["changes"]]
              assert env["command_id"] in ids

              isolated = sync.download(tenant_id="other-tenant", branch_id=branch, cursor=0, limit=100)
              assert env["command_id"] not in [x["command_id"] for x in isolated["changes"]]

              cursor = downloaded["next_cursor"]
              empty = sync.download(tenant_id=tenant, branch_id=branch, cursor=cursor, limit=100)
              assert env["command_id"] not in [x["command_id"] for x in empty["changes"]]

              print("TURSO_DEEP_OK")
              print("concurrency=PASS")
              print("idempotency=PASS")
              print("tenant_isolation=PASS")
              print("sync_cursor=PASS")
          finally:
              sync.close()
          PY
