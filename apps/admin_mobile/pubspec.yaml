name: mobile_shop_admin
description: Mobile Shop ERP admin application
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # No new packages needed: ApiClient uses dart:io HttpClient directly.
  # AppConfig uses sqflite (already a dependency) for settings persistence.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
